<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
</head>
<body>
    <div class="form-container reset-password-form">
        <div class="form-box">
            <h2>Set new password</h2>
            <img src="assets/images/reset-password.svg" height="200" width="200" alt="Reset password illustration" />
            <form id="reset-password-form" action="password_reset_complete.html" method="GET" novalidate>
                <!-- New Password Field -->
                <div class="field">
                    <i class="uil uil-lock-alt" aria-hidden="true"></i>
                    <input class="password-input" id="new-password" name="new-password" type="password"
                        placeholder="New password" autocomplete="new-password" required />
                    <div class="field-actions">
                        <!-- क्लिर बटन थपियो -->
                        <span class="clear-btn" id="clear-new-password" aria-label="Clear password">✕</span>
                        <div class="eye-btn" role="button" aria-label="Toggle password visibility" tabindex="0">
                            <i class="uil uil-eye-slash" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>
                <div id="new-password-requirements" class="password-requirements">
                    <div class="req-item invalid" id="new-req-length">
                        <span class="req-icon">✕</span> At least 8 characters
                    </div>
                    <div class="req-item invalid" id="new-req-uppercase">
                        <span class="req-icon">✕</span> Contains uppercase letter (A-Z)
                    </div>
                    <div class="req-item invalid" id="new-req-lowercase">
                        <span class="req-icon">✕</span> Contains lowercase letter (a-z)
                    </div>
                    <div class="req-item invalid" id="new-req-number">
                        <span class="req-icon">✕</span> Contains number (0-9)
                    </div>
                    <div class="req-item invalid" id="new-req-special">
                        <span class="req-icon">✕</span> Contains special character (!@#$%^&*)
                    </div>
                </div>

                <!-- Confirm New Password Field -->
                <div class="field">
                    <i class="uil uil-lock-access" aria-hidden="true"></i>
                    <input class="password-input" id="confirm-password" name="confirm-password" type="password"
                        placeholder="Confirm new password" autocomplete="new-password" required />
                    <div class="field-actions">
                        <!-- डेड आइकन हटाइयो र क्लिर बटनको ID मिलाइयो -->
                        <span class="clear-btn" id="clear-confirm" aria-label="Clear confirm password">✕</span>
                        <div class="eye-btn" role="button" aria-label="Toggle confirm password visibility" tabindex="0">
                            <i class="uil uil-eye-slash" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>
                <div id="status-text" class="status-text" role="status"></div>
                <input class="submit-btn" type="submit" value="Reset password" />
            </form>
        </div>
    </div>
    <script src="assets/script.js"></script>
</body>
</html>
