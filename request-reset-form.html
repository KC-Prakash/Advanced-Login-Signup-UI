<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
</head>
<body>
    <div class="form-container reset-request-form">
        <div class="form-box">
            <h2>Forgot password?</h2>
            <img src="assets/images/sending-email.svg" height="200" width="200" alt="Email illustration" />
            <p>Enter the email address linked to your account and we'll send you a reset link.</p>
            <form action="reset_send_message.html" novalidate>
                <div class="field">
                    <i class="uil uil-at" aria-hidden="true"></i>
                    <input id="reset-email" type="email" placeholder="Email address" autocomplete="email" required />
                    <div class="field-actions">
                        <span class="validation-icon" id="reset-email-validation" style="display:none;"></span>
                        <span class="clear-btn" id="clear-reset-email" style="display:none;" aria-label="Clear email">✕</span>
                    </div>
                </div>
                <input class="submit-btn" type="submit" value="Send reset link" />
            </form>
            <p style="margin-top:20px; padding:0; text-align:center; font-size:0.85em;">
                <a href="index.html" style="color:var(--primary-color); text-decoration:none; font-weight:500;">← Back to login</a>
            </p>
        </div>
    </div>
    <script src="assets/script.js"></script>
</body>
</html>
